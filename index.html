<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Text Box</title>
    <style>
        /* Base Stark Minimalist Styling (No-UI/UX Design) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Sticky Header */
        .header-container {
            background-color: #ffffff;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 2px solid #000000;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Main Container - Full PC/Mobile Layout */
        .main-wrapper {
            flex: 1;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .box {
            background-color: #ffffff;
            border: 2px solid #000000;
            border-radius: 0;
            padding: 25px;
            width: 100%;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .auth-card {
            max-width: 450px;
            margin: 40px auto;
            width: 100%;
        }

        /* Inputs & Labels */
        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            color: #000000;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            border: 2px solid #000000;
            border-radius: 0;
            outline: none;
            background-color: #ffffff;
            color: #000000;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            background-color: #f9f9f9;
        }

        /* Large PC/Mobile Journal Text Area */
        textarea {
            width: 100%;
            min-height: 400px;
            padding: 15px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            line-height: 1.5;
            border: 2px solid #000000;
            border-radius: 0;
            outline: none;
            background-color: #ffffff;
            color: #000000;
            resize: vertical;
            box-sizing: border-box;
        }

        textarea:focus {
            background-color: #fafafa;
        }

        /* Buttons */
        button {
            width: 100%;
            padding: 14px;
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            border-radius: 0;
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.1s, color 0.1s;
        }

        button:hover {
            background-color: #000000;
            color: #ffffff;
        }

        button.secondary {
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #000000;
        }

        button.secondary:hover {
            background-color: #eeeeee;
            color: #000000;
        }

        /* Links & Text */
        .link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            font-weight: bold;
        }

        .link a {
            color: #000000;
            text-decoration: underline;
            cursor: pointer;
        }

        .error {
            color: #dc2626;
            font-size: 14px;
            font-weight: bold;
            margin-top: 8px;
            text-align: center;
        }

        .success {
            color: #16a34a;
            font-size: 14px;
            font-weight: bold;
            margin-top: 8px;
            text-align: center;
        }

        .hidden { 
            display: none !important; 
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-text {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 15px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #ffffff;
            border-top: 4px solid #000000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Notes Viewer List */
        .texts-list {
            max-height: 500px;
            overflow-y: auto;
            border: 2px solid #000000;
            background-color: #ffffff;
            margin-top: 15px;
            padding: 15px;
        }

        .text-item {
            border-bottom: 1px solid #000000;
            padding: 12px 0;
            font-size: 15px;
        }

        .text-item:last-child {
            border-bottom: none;
        }

        .text-content {
            word-wrap: break-word;
            white-space: pre-wrap;
            margin-bottom: 6px;
            color: #000000;
        }

        .text-time {
            font-size: 12px;
            color: #555555;
            font-weight: bold;
        }

        .passcode-input {
            letter-spacing: 10px;
            text-align: center;
            font-size: 22px !important;
            font-weight: bold !important;
        }

        .divider {
            border-top: 2px solid #000000;
            margin: 20px 0;
        }

        .stats {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #000000;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #000000;
            color: #ffffff;
            padding: 12px 24px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10000;
            border: 1px solid #ffffff;
        }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            .main-wrapper {
                padding: 10px;
            }
            .box {
                padding: 15px;
            }
            textarea {
                min-height: 280px;
            }
            .auth-card {
                margin: 10px auto;
            }
        }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Loading...</div>
    </div>

    <header class="header-container">
        <h1 id="pageTitle">Secure Text Box</h1>
    </header>

    <main class="main-wrapper">
        <div class="box">

            <!-- Sign Up Page -->
            <div id="signupPage" class="auth-card">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="signupUser" placeholder="Enter username" autocomplete="off">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="signupPass" placeholder="Enter password">
                </div>
                <div id="signupError" class="error hidden"></div>
                <div id="signupSuccess" class="success hidden"></div>
                <button id="btnSignup" onclick="doSignup()">Sign Up</button>
                <div class="link">
                    Already have an account? <a onclick="showLogin()">Login</a>
                </div>
            </div>

            <!-- Login Page -->
            <div id="loginPage" class="auth-card hidden">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="loginUser" placeholder="Enter username" autocomplete="off">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPass" placeholder="Enter password">
                </div>
                <div id="loginError" class="error hidden"></div>
                <button id="btnLogin" onclick="doLogin()">Login</button>
                <div class="link">
                    New user? <a onclick="showSignup()">Sign Up</a>
                </div>
            </div>

            <!-- Set Passcode Page -->
            <div id="setPasscodePage" class="auth-card hidden">
                <p style="text-align:center; font-size:14px; font-weight:bold; margin-bottom:20px;">
                    FIRST TIME LOGIN!<br>SET A PASSCODE TO UNLOCK YOUR SECURE BOX.
                </p>
                <div class="input-group">
                    <label style="text-align:center;">Create Passcode</label>
                    <input type="password" id="newPasscode" class="passcode-input" placeholder="0000" maxlength="6" autocomplete="off">
                </div>
                <div class="input-group">
                    <label style="text-align:center;">Confirm Passcode</label>
                    <input type="password" id="confirmPasscode" class="passcode-input" placeholder="0000" maxlength="6" autocomplete="off">
                </div>
                <div id="passcodeError" class="error hidden"></div>
                <button onclick="doSetPasscode()">Set Passcode</button>
            </div>

            <!-- Main Journal/Editor Page -->
            <div id="mainPage" class="hidden">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom: 2px solid #000; padding-bottom: 10px;">
                    <span id="welcomeUser" style="font-size:14px; font-weight:bold; text-transform:uppercase;"></span>
                    <a onclick="doLogout()" style="font-size:13px; font-weight:bold; cursor:pointer; color:#dc2626; text-decoration:underline; text-transform:uppercase;">Logout</a>
                </div>

                <div class="input-group">
                    <textarea id="textInput" placeholder="Write your notes here..."></textarea>
                </div>

                <div id="saveStatus" class="success hidden" style="margin-top:5px;"></div>
                <button onclick="saveText()">Save Text</button>

                <div class="divider"></div>
                
                <button class="secondary" onclick="openBox()">Open Box</button>
                <div class="stats" id="localCount">Local: 0 texts</div>
            </div>

            <!-- Passcode Verification Page -->
            <div id="verifyPage" class="auth-card hidden">
                <p style="text-align:center; font-size:14px; font-weight:bold; margin-bottom:20px;">
                    ENTER YOUR PASSCODE TO OPEN THE BOX
                </p>
                <div class="input-group">
                    <label style="text-align:center;">Passcode</label>
                    <input type="password" id="verifyPasscode" class="passcode-input" placeholder="0000" maxlength="6" autocomplete="off">
                </div>
                <div id="verifyError" class="error hidden"></div>
                <button onclick="doVerifyPasscode()">Unlock</button>
                <div class="link">
                    <a onclick="showMain()">Cancel</a>
                </div>
            </div>

            <!-- Saved Notes View Box -->
            <div id="boxPage" class="hidden">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom: 2px solid #000; padding-bottom: 10px;">
                    <span style="font-size:14px; font-weight:bold; text-transform:uppercase;">Your Saved Notes</span>
                    <a onclick="showMain()" style="font-size:13px; font-weight:bold; cursor:pointer; color:#000000; text-decoration:underline; text-transform:uppercase;">Close</a>
                </div>

                <div class="stats" id="totalCount" style="margin-bottom:10px; text-align:left;">Total: 0 texts</div>
                <div class="texts-list" id="textsList">
                    <div style="text-align:center; color:#555; padding:20px; font-size:14px; font-weight:bold;">No notes saved yet</div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz2LHwa8enNgbWWxX6_EeRWKtA6W510N8rYpny6MZBtnHOiVnPpCdbwKbvDirJVw3qz/exec";

        let currentUser = localStorage.getItem('stb_user') || '';
        let localTexts = JSON.parse(localStorage.getItem('stb_texts_' + currentUser) || '[]');

        function showLoading(text) {
            document.getElementById('loadingText').textContent = text || 'Loading...';
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        function showSignup() {
            hideAll();
            document.getElementById('signupPage').classList.remove('hidden');
            document.getElementById('pageTitle').textContent = 'Sign Up';
        }
        function showLogin() {
            hideAll();
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('pageTitle').textContent = 'Login';
        }
        function showSetPasscode() {
            hideAll();
            document.getElementById('setPasscodePage').classList.remove('hidden');
            document.getElementById('pageTitle').textContent = 'Set Passcode';
        }
        function showMain() {
            hideAll();
            document.getElementById('mainPage').classList.remove('hidden');
            document.getElementById('pageTitle').textContent = 'Secure Text Box';
            document.getElementById('welcomeUser').textContent = currentUser;
            updateLocalCount();
        }
        function showVerify() {
            hideAll();
            document.getElementById('verifyPage').classList.remove('hidden');
            document.getElementById('pageTitle').textContent = 'Verify Passcode';
            document.getElementById('verifyPasscode').value = '';
            document.getElementById('verifyError').classList.add('hidden');
        }
        function showBox() {
            hideAll();
            document.getElementById('boxPage').classList.remove('hidden');
            document.getElementById('pageTitle').textContent = 'Saved Notes';
        }
        function hideAll() {
            ['signupPage','loginPage','setPasscodePage','mainPage','verifyPage','boxPage'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
        }

        async function apiCall(action, payload) {
            const data = { action, ...payload };
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(data)
            });
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            const text = await response.text();
            const cleanText = text.replace(/^[^\{]*/, '').replace(/[^\}]*$/, '') || text;
            return JSON.parse(cleanText);
        }

        async function doSignup() {
            const user = document.getElementById('signupUser').value.trim();
            const pass = document.getElementById('signupPass').value;
            const err = document.getElementById('signupError');
            const suc = document.getElementById('signupSuccess');

            if(!user || !pass) { err.textContent='Fill all fields'; err.classList.remove('hidden'); return; }

            showLoading('Creating account...');
            try {
                const data = await apiCall('signup', { username: user, password: pass });
                hideLoading();

                if(data.success) {
                    err.classList.add('hidden');
                    suc.textContent = 'Account created! Login now.';
                    suc.classList.remove('hidden');
                    setTimeout(() => { suc.classList.add('hidden'); showLogin(); }, 1500);
                } else {
                    suc.classList.add('hidden');
                    err.textContent = data.message;
                    err.classList.remove('hidden');
                }
            } catch(e) {
                hideLoading();
                err.textContent = 'Error: ' + e.message;
                err.classList.remove('hidden');
                console.error('Signup error:', e);
            }
        }

        async function doLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;
            const err = document.getElementById('loginError');

            if(!user || !pass) { err.textContent='Fill all fields'; err.classList.remove('hidden'); return; }

            showLoading('Logging in...');
            try {
                const data = await apiCall('login', { username: user, password: pass });
                hideLoading();

                if(data.success) {
                    currentUser = user;
                    localStorage.setItem('stb_user', user);
                    localTexts = JSON.parse(localStorage.getItem('stb_texts_' + user) || '[]');
                    err.classList.add('hidden');

                    if(!data.hasPasscode) {
                        showSetPasscode();
                    } else {
                        showMain();
                        syncTexts();
                    }
                } else {
                    err.textContent = data.message;
                    err.classList.remove('hidden');
                }
            } catch(e) {
                hideLoading();
                err.textContent = 'Error: ' + e.message;
                err.classList.remove('hidden');
                console.error('Login error:', e);
            }
        }

        async function doSetPasscode() {
            const p1 = document.getElementById('newPasscode').value;
            const p2 = document.getElementById('confirmPasscode').value;
            const err = document.getElementById('passcodeError');

            if(!p1 || p1.length < 4) { err.textContent='Min 4 digits'; err.classList.remove('hidden'); return; }
            if(p1 !== p2) { err.textContent='Passcodes do not match'; err.classList.remove('hidden'); return; }

            showLoading('Setting passcode...');
            try {
                const data = await apiCall('setPasscode', { username: currentUser, passcode: p1 });
                hideLoading();

                if(data.success) {
                    showToast('Passcode set!');
                    showMain();
                    syncTexts();
                } else {
                    err.textContent = data.message;
                    err.classList.remove('hidden');
                }
            } catch(e) {
                hideLoading();
                err.textContent = 'Error: ' + e.message;
                err.classList.remove('hidden');
            }
        }

        async function doVerifyPasscode() {
            const code = document.getElementById('verifyPasscode').value;
            const err = document.getElementById('verifyError');

            if(!code) { err.textContent='Enter passcode'; err.classList.remove('hidden'); return; }

            showLoading('Verifying...');
            try {
                const data = await apiCall('verifyPasscode', { username: currentUser, passcode: code });
                hideLoading();

                if(data.success) {
                    err.classList.add('hidden');
                    loadBoxContents();
                } else {
                    err.textContent = data.message;
                    err.classList.remove('hidden');
                }
            } catch(e) {
                hideLoading();
                err.textContent = 'Error: ' + e.message;
                err.classList.remove('hidden');
            }
        }

        function doLogout() {
            currentUser = '';
            localStorage.removeItem('stb_user');
            showLogin();
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
        }

        function saveText() {
            const text = document.getElementById('textInput').value.trim();
            if(!text) return;

            const now = new Date();
            const timestamp = now.getFullYear() + '-' + 
                String(now.getMonth()+1).padStart(2,'0') + '-' + 
                String(now.getDate()).padStart(2,'0') + ' ' + 
                String(now.getHours()).padStart(2,'0') + ':' + 
                String(now.getMinutes()).padStart(2,'0') + ':' + 
                String(now.getSeconds()).padStart(2,'0');

            const entry = { text: text, timestamp: timestamp, synced: false };
            localTexts.unshift(entry);
            localStorage.setItem('stb_texts_' + currentUser, JSON.stringify(localTexts));

            document.getElementById('textInput').value = '';
            updateLocalCount();
            showToast('Saved locally');

            syncSingle(entry);
        }

        async function syncSingle(entry) {
            if(entry.synced) return;
            try {
                const data = await apiCall('saveText', { username: currentUser, text: entry.text });
                if(data.success) {
                    entry.synced = true;
                    entry.timestamp = data.timestamp || entry.timestamp;
                    localStorage.setItem('stb_texts_' + currentUser, JSON.stringify(localTexts));
                    updateLocalCount();
                }
            } catch(e) {
                console.log('Sync failed, will retry later');
            }
        }

        async function syncTexts() {
            const unsynced = localTexts.filter(t => !t.synced);
            for(const entry of unsynced) {
                await syncSingle(entry);
            }
        }

        async function loadBoxContents() {
            showLoading('Loading texts...');

            let sheetTexts = [];
            try {
                const data = await apiCall('getTexts', { username: currentUser });
                if(data.success) {
                    sheetTexts = data.texts || [];
                }
            } catch(e) {
                console.log('Sheet fetch failed, using local only');
            }

            hideLoading();
            showBox();

            const localTextsOnly = localTexts.map(t => t.text);
            const merged = [...localTexts];

            for(const st of sheetTexts) {
                if(!localTextsOnly.includes(st.text)) {
                    merged.push({ text: st.text, timestamp: st.timestamp, synced: true });
                }
            }

            merged.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

            const list = document.getElementById('textsList');
            document.getElementById('totalCount').textContent = 'Total: ' + merged.length + ' texts';

            if(merged.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#555; padding:20px; font-size:14px; font-weight:bold;">No notes saved yet</div>';
                return;
            }

            list.innerHTML = merged.map(item => `
                <div class="text-item">
                    <div class="text-content">${escapeHtml(item.text)}</div>
                    <div class="text-time">${item.timestamp} ${item.synced === false ? '<span style="color:#d97706">[local]</span>' : ''}</div>
                </div>
            `).join('');
        }

        function updateLocalCount() {
            const unsynced = localTexts.filter(t => !t.synced).length;
            const total = localTexts.length;
            document.getElementById('localCount').textContent = 
                'Local: ' + total + ' texts' + (unsynced > 0 ? ' (' + unsynced + ' unsynced)' : '');
        }

        function openBox() {
            showVerify();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if(existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 2000);
        }

        window.onload = function() {
            if(currentUser) {
                showMain();
                syncTexts();
            } else {
                showLogin();
            }
        };
    </script>
</body>
</html>
